services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fileora-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["pnpm", "--filter", "@gold-era/server", "prisma:migrate:deploy"]
    environment: &server-environment
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PORT: ${PORT:?Set PORT}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:?Set ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?Set REFRESH_TOKEN_TTL}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?Set BFF_SHARED_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:?Set SUPABASE_STORAGE_BUCKET}
      UPLOAD_MAX_FILE_SIZE_BYTES: "5242880"
      USER_STORAGE_QUOTA_BYTES: "104857600"
      UPLOAD_ALLOWED_MIME_TYPES: application/pdf,text/plain,image/jpeg,image/png,image/webp,application/vnd.openxmlformats-officedocument.wordprocessingml.document
      UPLOAD_MAX_FILES_PER_BATCH: "10"
      FILE_EXTRACTION_MAX_BYTES: "5242880"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment: *server-environment
    ports: ["${PORT:?Set PORT}:${PORT:?Set PORT}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PORT:?Set PORT}/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
      AUTH_API_BASE_URL: http://server:${PORT:?Set PORT}
      AUTH_BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?Set BFF_SHARED_SECRET}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:?Set REFRESH_COOKIE_NAME}
      REFRESH_COOKIE_PATH: /api/auth
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:?Set REFRESH_COOKIE_SAME_SITE}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:?Set REFRESH_COOKIE_SECURE}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?Set REFRESH_TOKEN_TTL}
    ports: ["3000:3000"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  fileora-postgres:
