openapi: 3.1.0
info:
  title: Gold Era Phase 2 File Management API
  version: 2.0.0
  description: >-
    Authenticated, ownership-scoped file, folder, content, quota, and statistics
    contracts. Supabase storage keys, provider URLs, and credentials are never public.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
tags:
  - name: Files
  - name: Folders
  - name: Statistics
paths:
  /api/v1/files/policy:
    get:
      tags: [Files]
      operationId: getUploadPolicy
      summary: Return safe effective upload rules for immediate client validation
      responses:
        "200":
          description: Upload policy and current quota snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPolicyResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/files:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Validate and upload exactly one file from a client-managed batch
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  oneOf:
                    - type: string
                      format: uuid
                    - type: "null"
      responses:
        "201":
          description: Object and metadata are available; extraction state is final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          description: File exceeds 5,242,880 bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Authoritatively detected content is not launch-supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: File would exceed the user's retained-byte quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaErrorEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Files]
      operationId: listFiles
      summary: Search, filter, sort, and paginate the caller's files
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/FileTypeCategory" }
        - name: folderId
          in: query
          description: UUID for one owned folder, `root` for unfiled items, absent for all locations
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                const: root
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, size, uploadedAt]
            default: uploadedAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Stable ownership-scoped page; every order appends file id as tie-breaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: getFile
      summary: Return one owned file and its authorized folder path
      responses:
        "200":
          description: File details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Files]
      operationId: moveFile
      summary: Move one owned file to root or an owned folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileRequest"
      responses:
        "200":
          description: Updated file location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Permanently remove an owned object and metadata
      description: >-
        The client must obtain irreversible-action confirmation. Provider absence is
        idempotent; known partial failures are retryable and are not returned as success.
      responses:
        "204": { description: File is permanently absent and quota is reclaimed }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/files/{fileId}/preview:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: previewFile
      summary: Stream one currently authorized previewable file
      responses:
        "200":
          description: >-
            Request-bound content with verified Content-Type, authoritative Content-Length,
            Content-Disposition inline, Cache-Control private/no-store, and nosniff.
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "415":
          description: The owned format has no Phase 2 preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/files/{fileId}/download:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Stream one currently authorized file as an attachment
      responses:
        "200":
          description: >-
            Full content with verified Content-Type, authoritative Content-Length, safe
            Content-Disposition attachment filename, private/no-store, and nosniff.
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/folders:
    get:
      tags: [Folders]
      operationId: listFolderChildren
      summary: Return owned child folders and files at root or one folder
      parameters:
        - name: parentId
          in: query
          description: Owned folder UUID; absent means virtual root
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Folder contents and breadcrumb path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderContentsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Create one owned folder at root or beneath an owned folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: Case-insensitive trimmed sibling name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Parent would create level 11 or has an invalid hierarchy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    get:
      tags: [Folders]
      operationId: getFolder
      summary: Return one owned folder and root-first breadcrumbs
      responses:
        "200":
          description: Folder details and breadcrumb path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Folders]
      operationId: renameFolder
      summary: Rename one owned folder without changing its parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFolderRequest"
      responses:
        "200":
          description: Renamed folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: Case-insensitive trimmed sibling name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Folders]
      operationId: deleteFolder
      summary: Permanently remove an owned empty folder without cascading
      responses:
        "204": { description: Empty folder permanently removed }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: Folder contains a child folder or file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/file-statistics:
    get:
      tags: [Statistics]
      operationId: getFileStatistics
      summary: Return current owned-file totals and 30 local-day upload history
      parameters:
        - name: timeZone
          in: query
          required: true
          description: Browser-displayed IANA timezone, for example Africa/Cairo
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Ownership-scoped statistics with exactly 30 zero-filled daily buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStatisticsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ValidationError:
      description: Request boundary validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: Missing, invalid, expired, or deleted-user authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ResourceNotFound:
      description: >-
        Generic absent result for foreign, missing, permanently deleted, malformed,
        or otherwise unauthorized resource identifiers; no existence distinction.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailable:
      description: Safe retryable infrastructure or known partial-operation failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    DecimalBytes:
      type: string
      pattern: "^[0-9]+$"
      examples: ["5242880"]
    FileTypeCategory:
      type: string
      enum: [pdf, text, image, document]
    ExtractionState:
      type: string
      enum: [available, unavailable]
    PreviewKind:
      type: string
      enum: [pdf, text, image, unavailable]
    FolderSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
    FileSummary:
      type: object
      additionalProperties: false
      required: [id, originalName, mimeType, typeCategory, sizeBytes, folder, uploadedAt, previewKind, extractionState]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string }
        typeCategory: { $ref: "#/components/schemas/FileTypeCategory" }
        sizeBytes: { $ref: "#/components/schemas/DecimalBytes" }
        folder:
          oneOf:
            - $ref: "#/components/schemas/FolderSummary"
            - type: "null"
        uploadedAt: { type: string, format: date-time }
        previewKind: { $ref: "#/components/schemas/PreviewKind" }
        extractionState: { $ref: "#/components/schemas/ExtractionState" }
    FileDetail:
      type: object
      additionalProperties: false
      required: [id, originalName, mimeType, typeCategory, sizeBytes, folder, uploadedAt, previewKind, extractionState, folderPath, extractedContent, updatedAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string }
        typeCategory: { $ref: "#/components/schemas/FileTypeCategory" }
        sizeBytes: { $ref: "#/components/schemas/DecimalBytes" }
        folder:
          oneOf:
            - $ref: "#/components/schemas/FolderSummary"
            - type: "null"
        uploadedAt: { type: string, format: date-time }
        previewKind: { $ref: "#/components/schemas/PreviewKind" }
        extractionState: { $ref: "#/components/schemas/ExtractionState" }
        folderPath:
          type: array
          items: { $ref: "#/components/schemas/FolderSummary" }
        extractedContent:
          oneOf:
            - type: string
            - type: "null"
        updatedAt: { type: string, format: date-time }
    Folder:
      type: object
      additionalProperties: false
      required: [id, name, parentId, depth, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        parentId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        depth: { type: integer, minimum: 1, maximum: 10 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QuotaSnapshot:
      type: object
      additionalProperties: false
      required: [usedBytes, remainingBytes, limitBytes]
      properties:
        usedBytes: { $ref: "#/components/schemas/DecimalBytes" }
        remainingBytes: { $ref: "#/components/schemas/DecimalBytes" }
        limitBytes: { $ref: "#/components/schemas/DecimalBytes" }
    UploadPolicy:
      type: object
      additionalProperties: false
      required: [maxFileSizeBytes, maxFilesPerBatch, allowedMimeTypes, quota]
      properties:
        maxFileSizeBytes: { $ref: "#/components/schemas/DecimalBytes" }
        maxFilesPerBatch: { type: integer, const: 10 }
        allowedMimeTypes:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items: { type: string }
        quota: { $ref: "#/components/schemas/QuotaSnapshot" }
    Pagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    SuccessEnvelopeBase:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    FileResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/FileSummary" }
    FileDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/FileDetail" }
    FilePageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/FileSummary" }
            meta: { $ref: "#/components/schemas/Pagination" }
    UploadPolicyResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/UploadPolicy" }
    MoveFileRequest:
      type: object
      additionalProperties: false
      required: [folderId]
      properties:
        folderId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name, parentId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        parentId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    RenameFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    FolderResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/Folder" }
    FolderDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [folder, breadcrumbs]
              properties:
                folder: { $ref: "#/components/schemas/Folder" }
                breadcrumbs:
                  type: array
                  items: { $ref: "#/components/schemas/FolderSummary" }
    FolderContentsResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [folder, breadcrumbs, folders, files]
              properties:
                folder:
                  oneOf:
                    - $ref: "#/components/schemas/Folder"
                    - type: "null"
                breadcrumbs:
                  type: array
                  items: { $ref: "#/components/schemas/FolderSummary" }
                folders:
                  type: array
                  items: { $ref: "#/components/schemas/Folder" }
                files:
                  type: array
                  items: { $ref: "#/components/schemas/FileSummary" }
    TypeDistributionItem:
      type: object
      additionalProperties: false
      required: [type, count]
      properties:
        type: { $ref: "#/components/schemas/FileTypeCategory" }
        count: { type: integer, minimum: 0 }
    UploadHistoryItem:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }
    FileStatisticsResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [fileCount, storedBytes, quota, typeDistribution, uploadHistory, timeZone]
              properties:
                fileCount: { type: integer, minimum: 0 }
                storedBytes: { $ref: "#/components/schemas/DecimalBytes" }
                quota: { $ref: "#/components/schemas/QuotaSnapshot" }
                typeDistribution:
                  type: array
                  items: { $ref: "#/components/schemas/TypeDistributionItem" }
                uploadHistory:
                  type: array
                  minItems: 30
                  maxItems: 30
                  items: { $ref: "#/components/schemas/UploadHistoryItem" }
                timeZone: { type: string }
    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - AUTH_REQUIRED
            - RESOURCE_NOT_FOUND
            - FILE_TOO_LARGE
            - FILE_TYPE_UNSUPPORTED
            - FILE_QUOTA_EXCEEDED
            - FOLDER_NAME_CONFLICT
            - FOLDER_DEPTH_EXCEEDED
            - FOLDER_NOT_EMPTY
            - PREVIEW_UNAVAILABLE
            - SERVICE_UNAVAILABLE
        message: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldIssue" }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ErrorBody" }
    QuotaErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ErrorBody" }
        meta: { $ref: "#/components/schemas/QuotaSnapshot" }
