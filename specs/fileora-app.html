    @media(max-width:820px){:root{--sidebar:0px}.app{display:block}.sidebar{position:fixed;left:0;transform:translateX(-102%);width:276px;transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile-side-overlay{display:block;position:fixed;inset:0;background:oklch(0.08 0.01 255 / .48);z-index:19;opacity:0;pointer-events:none}.mobile-side-overlay.open{opacity:1;pointer-events:auto}.mobile-menu{display:grid}.topbar{padding:0 14px}.global-search{min-width:0}.global-search .kbd{display:none}.main{padding-top:22px}.workspace{grid-template-columns:1fr}.folder-panel{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.folder-panel h2,.folder-actions{grid-column:1/-1}.toolbar .select-hide{display:none}.metric-grid{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.grid-view{grid-template-columns:repeat(2,1fr)}.file-table th:nth-child(3),.file-table td:nth-child(3),.file-table th:nth-child(4),.file-table td:nth-child(4){display:none}.auth-shell{grid-template-columns:1fr}.auth-story{min-height:320px}.auth-story h1{font-size:55px;margin:45px 0 10px}.landing-hero{grid-template-columns:1fr}.landing-visual{height:360px}.landing-features{grid-template-columns:1fr}}
    @media(max-width:560px){.topbar{height:64px}.topbar .global-search{display:none}.main{padding:18px 14px 35px}.page-head{display:block}.page-head h1{font-size:34px}.head-actions{justify-content:flex-start;margin-top:18px}.head-actions .btn{flex:1}.metric-grid{grid-template-columns:1fr}.metric:last-child{grid-column:auto}.folder-panel{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%}.grid-view{grid-template-columns:1fr 1fr}.grid-file{min-height:145px}.file-table th:nth-child(2),.file-table td:nth-child(2){display:none}.pagination{align-items:flex-start;gap:10px}.pagination-controls .btn{padding:0 11px}.drawer-actions{grid-template-columns:1fr}.dl-row{grid-template-columns:1fr;gap:5px}.recent-row{grid-template-columns:1fr;gap:4px}.auth-story{min-height:270px;padding:27px}.auth-story h1{font-size:43px;margin:38px 0 10px}.auth-form{padding:34px 22px}.theme-row{right:15px;top:14px}.landing-nav{padding:0 16px}.landing-hero{padding:60px 18px}.landing-hero h1{font-size:58px}.landing-actions{flex-direction:column}.landing-visual{height:300px}.mini-grid{grid-template-columns:1fr 1fr}.mini-card:last-child{display:none}}

<body>
  <a class="skip" href="#content">Skip to content</a>
  <div id="root"></div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <script>
    const I=(name,cls='')=>{const p={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5M9 21v-7h6v7"/>',files:'<path d="M3 7h6l2 2h10v11H3z"/><path d="M3 7V4h7l2 3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',shield:'<path d="M12 3 4 6v5c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.7M16 3.2a4 4 0 0 1 0 7.6"/>',activity:'<path d="M3 12h4l2.3-7 4.4 14 2.3-7h5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5"/><path d="M5 20h14"/>',plus:'<path d="M12 5v14M5 12h14"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".5"/><circle cx="3.5" cy="12" r=".5"/><circle cx="3.5" cy="18" r=".5"/>',filter:'<path d="M4 5h16l-6 7v5l-4 2v-7z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',moon:'<path d="M20 15a8 8 0 1 1-11-11 7 7 0 0 0 11 11"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 21h14"/>',move:'<path d="M5 9h14M15 5l4 4-4 4M19 17H5M9 13l-4 4 4 4"/>',trash:'<path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7M10 11v6M14 11v6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',chev:'<path d="m9 18 6-6-6-6"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3M15 5h5v14h-5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};return `<svg aria-hidden="true" class="icon ${cls}" viewBox="0 0 24 24">${p[name]||p.files}</svg>`}
    const sampleFiles=[
      {id:1,name:'Q3 product strategy.pdf',type:'PDF',size:'2.4 MB',folder:'Strategy',date:'Aug 22, 2026'},
      {id:2,name:'Customer interview notes.txt',type:'TXT',size:'84 KB',folder:'Research',date:'Aug 21, 2026'},
      {id:3,name:'Homepage direction.webp',type:'WEBP',size:'1.8 MB',folder:'Brand assets',date:'Aug 19, 2026'},
      {id:4,name:'Contract — Northstar.docx',type:'DOCX',size:'640 KB',folder:'My Files',date:'Aug 18, 2026'},
      {id:5,name:'Team offsite.jpg',type:'JPG',size:'3.1 MB',folder:'My Files',date:'Aug 14, 2026'},
      {id:6,name:'Release checklist.txt',type:'TXT',size:'22 KB',folder:'Strategy',date:'Aug 10, 2026'}
    ];
    const state={route:'files',view:'list',query:'',type:'all',folder:'My Files',files:[...sampleFiles],theme:localStorage.getItem('fileora-theme')||'system',queue:[],admin:true};
    const routes={overview:['home','Overview'],files:['files','Files'],profile:['user','Profile'],'admin-overview':['shield','Platform'],'admin-users':['users','Users'],'admin-files':['files','Global files'],'admin-audit':['activity','Audit history']};
    function themeButton(){const meta={system:['monitor','System'],light:['sun','Light'],dark:['moon','Dark']}[state.theme];return `<button class="theme-toggle" data-theme-toggle aria-label="Appearance: ${meta[1]}. Activate to use the next theme." title="Appearance: ${meta[1]}" onclick="cycleTheme()">${I(meta[0],'sm')}<span>${meta[1]}</span></button>`}
    function cycleTheme(){const order=['system','light','dark'];setTheme(order[(order.indexOf(state.theme)+1)%order.length]);const meta={system:['monitor','System'],light:['sun','Light'],dark:['moon','Dark']}[state.theme];document.querySelectorAll('[data-theme-toggle]').forEach(button=>{button.innerHTML=`${I(meta[0],'sm')}<span>${meta[1]}</span>`;button.setAttribute('aria-label',`Appearance: ${meta[1]}. Activate to use the next theme.`);button.title=`Appearance: ${meta[1]}`})}
    function setTheme(v){state.theme=v;localStorage.setItem('fileora-theme',v);const eff=v==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v;document.documentElement.dataset.theme=eff}
    matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='system')setTheme('system')});
    function navButton(key,count=''){const [ic,label]=routes[key];return `<button data-route="${key}" class="${state.route===key?'active':''}" aria-current="${state.route===key?'page':'false'}" onclick="go('${key}')">${I(ic)}<span>${label}</span>${count?`<span class="count">${count}</span>`:''}</button>`}
    function shell(content){return `<div class="mobile-side-overlay" id="sideBackdrop" onclick="toggleSide(false)"></div><div class="app"><aside class="sidebar" id="sidebar" aria-label="Primary navigation"><button class="brand" onclick="go('overview')"><span class="brand-mark"></span>Fileora</button><div class="tagline">Your files. Organized your way.</div><div class="nav-label">Workspace</div><nav class="nav">${navButton('overview')}${navButton('files',state.files.length)}${navButton('profile')}</nav>${state.admin?`<div class="admin-nav"><div class="nav-label">Administration</div><div class="restricted">● RESTRICTED ACCESS</div><nav class="nav">${navButton('admin-overview')}${navButton('admin-users')}${navButton('admin-files')}${navButton('admin-audit')}</nav></div>`:''}<div class="side-bottom"><div class="storage-mini"><div class="storage-copy"><span>64.2 MB used</span><span>100 MB</span></div><div class="track"><span style="width:64%"></span></div></div><button class="user-chip" onclick="go('profile')"><span class="avatar">AM</span><span class="user-meta"><strong>Alex Morgan</strong><span>${state.admin?'Administrator':'Member'} · Demo workspace</span></span></button></div></aside><div class="shell"><header class="topbar"><button class="icon-btn mobile-menu" aria-label="Open navigation" onclick="toggleSide(true)">${I('menu')}</button><label class="global-search">${I('search')}<input aria-label="Search Fileora" placeholder="Search files and folders"><span class="kbd" style="position:absolute;right:12px;top:12px">⌘ K</span></label><div class="top-actions">${themeButton()}<button class="icon-btn" aria-label="Sign out" onclick="showAuth('login')">${I('logout')}</button></div></header><main id="content" class="main">${content}</main></div></div>`}
    function toggleSide(open){document.getElementById('sidebar')?.classList.toggle('open',open);document.getElementById('sideBackdrop')?.classList.toggle('open',open)}
    function go(route){state.route=route;toggleSide(false);render();window.scrollTo(0,0)}
    const head=(eyebrow,title,copy,actions='')=>`<header class="page-head" data-od-id="${state.route}-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${copy}</p></div><div class="head-actions">${actions}</div></header>`;
    function overview(){const bars=[12,20,8,32,15,28,10,16,35,24,18,12,30,44,20,27,13,37,20,48,31,18,35,58,44,67,39,72,55,84];return `${head('Personal overview','Good afternoon, Alex.','A clear view of your archive across the last 30 days. Times shown in Africa/Cairo.',`<button class="btn primary" onclick="go('files')">${I('files')}Open your files</button>`)}<section class="metric-grid" data-od-id="personal-metrics"><article class="card metric"><div class="metric-top"><span>Current files</span>${I('files')}</div><strong>${state.files.length}</strong><small>Across 4 folders</small></article><article class="card metric"><div class="metric-top"><span>Storage used</span><span class="mono">64%</span></div><strong>64.2 MB</strong><small>35.8 MB remains</small></article><article class="card metric"><div class="metric-top"><span>Recent uploads</span>${I('upload')}</div><strong>11</strong><small>Last 30 local days</small></article></section><div class="dashboard-grid"><section class="card" data-od-id="upload-activity"><div class="panel-head"><h2>Upload activity</h2><span class="pill">30 days · Africa/Cairo</span></div><div class="chart" role="img" aria-label="30-day upload activity; eleven uploads total">${bars.map((b,i)=>`<span class="bar" style="height:${b}%" data-value="${i%6===0?0:(i%5===0?2:1)}"></span>`).join('')}</div><table hidden><caption>Daily uploads over the last 30 days</caption><tbody>${bars.map((b,i)=>`<tr><th>Day ${i+1}</th><td>${i%6===0?0:(i%5===0?2:1)}</td></tr>`).join('')}</tbody></table></section><section class="card storage-card" data-od-id="storage-usage"><div class="panel-head" style="padding:0"><h2>Storage</h2><span class="pill success">Healthy</span></div><div class="storage-ring"><span>64%</span></div><div class="legend"><div class="legend-row"><span>PDF</span><strong>28.4 MB</strong></div><div class="legend-row"><span>Images</span><strong>22.1 MB</strong></div><div class="legend-row"><span>Documents</span><strong>13.7 MB</strong></div></div></section></div>`}
    function folderPanel(){return `<aside class="card folder-panel" data-od-id="folder-browser"><h2>FOLDERS</h2>${['My Files','Strategy','Research','Brand assets'].map((f,i)=>`<button class="folder ${state.folder===f?'active':''}" onclick="selectFolder('${f}')">${I('files','sm')}<span>${f}</span><small>${[6,2,1,1][i]}</small></button>`).join('')}<div class="folder-actions"><button class="btn" onclick="openModal('folder')">${I('plus','sm')}New folder</button><button class="icon-btn" aria-label="Folder options" onclick="folderOptions()">${I('more')}</button></div></aside>`}
    function selectFolder(f){state.folder=f;render()}
    function filtered(){return state.files.filter(f=>(state.folder==='My Files'||f.folder===state.folder)&&f.name.toLowerCase().includes(state.query.toLowerCase())&&(state.type==='all'||f.type.toLowerCase()===state.type))}
    function filesView(){const data=filtered();return `${head('My workspace',state.folder,state.folder==='My Files'?'Browse, upload, and organize everything you own.':'This folder is owner-scoped. Folder movement is not supported.',`<button class="btn" onclick="openModal('folder')">${I('plus')}New folder</button><button class="btn primary" onclick="openModal('upload')">${I('upload')}Upload files</button>`)}<div class="workspace">${folderPanel()}<section class="content-panel" data-od-id="file-collection"><div class="breadcrumbs"><button onclick="selectFolder('My Files')">My Files</button>${state.folder!=='My Files'?`${I('chev','sm')}<button>${state.folder}</button>`:''}</div><div class="toolbar"><label class="search">${I('search')}<input maxlength="200" value="${state.query}" oninput="state.query=this.value;renderFileCollection()" aria-label="Search files" placeholder="Search this location"></label><select class="select select-hide" aria-label="File type" style="width:140px" onchange="state.type=this.value;renderFileCollection()"><option value="all">All types</option><option value="pdf" ${state.type==='pdf'?'selected':''}>PDF</option><option value="txt" ${state.type==='txt'?'selected':''}>Text</option><option value="jpg" ${state.type==='jpg'?'selected':''}>Image</option><option value="docx" ${state.type==='docx'?'selected':''}>Document</option></select><button class="icon-btn" aria-label="More filters" onclick="openModal('filters')">${I('filter')}</button><div class="segmented" aria-label="View"><button class="${state.view==='list'?'active':''}" aria-pressed="${state.view==='list'}" onclick="state.view='list';renderFileCollection()">${I('list','sm')}</button><button class="${state.view==='grid'?'active':''}" aria-pressed="${state.view==='grid'}" onclick="state.view='grid';renderFileCollection()">${I('grid','sm')}</button></div></div><div id="fileCollection">${fileCollection(data)}</div></section></div>`}
    function renderFileCollection(){const el=document.getElementById('fileCollection');if(el)el.innerHTML=fileCollection(filtered())}
    function fileCollection(data){if(!data.length)return `<div class="card empty"><div class="empty-icon"></div><h3>${state.query||state.type!=='all'?'Nothing found':'Your archive is ready'}</h3><p>${state.query||state.type!=='all'?'No files match these filters. Try a broader search or clear a filter.':'Add your first file to begin building this folder.'}</p>${state.query||state.type!=='all'?`<button class="btn" onclick="state.query='';state.type='all';render()">Clear filters</button>`:`<button class="btn primary" onclick="openModal('upload')">Upload files</button>`}</div>`;if(state.view==='grid')return `<div class="grid-view">${data.map(f=>`<article class="card grid-file" data-od-id="file-${f.id}" onclick="openDetails(${f.id})"><span class="file-icon">${f.type}</span><strong title="${f.name}">${f.name}</strong><span>${f.size} · ${f.date}</span></article>`).join('')}</div>${pagination(data.length)}`;return `<div class="card file-card"><table class="file-table"><thead><tr><th>Name</th><th>Type / size</th><th>Location</th><th>Uploaded</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${data.map(f=>`<tr data-od-id="file-${f.id}" onclick="openDetails(${f.id})"><td><div class="file-name"><span class="file-icon">${f.type}</span><span><strong title="${f.name}">${f.name}</strong><small>Verified content type</small></span></div></td><td>${f.type}<br><span class="subtle">${f.size}</span></td><td>${f.folder}</td><td>${f.date}</td><td><button class="icon-btn" aria-label="Open ${f.name}" onclick="event.stopPropagation();openDetails(${f.id})">${I('more')}</button></td></tr>`).join('')}</tbody></table></div>${pagination(data.length)}`}
    function pagination(n){return `<div class="pagination"><span>${n} matching file${n===1?'':'s'} · Page 1 of 1</span><div class="pagination-controls"><button class="btn" disabled>Previous</button><button class="btn" disabled>Next</button></div></div>`}
    function profile(){return `${head('Account','Your profile','Identity and authorization details returned safely by your account service.')}<div class="profile-grid"><section class="card identity" data-od-id="profile-identity"><div class="identity-hero"><span class="avatar xl">AM</span><div><h2>Alex Morgan</h2><p>alex.morgan@example.com</p></div></div><dl class="dl"><div class="dl-row"><dt>Full name</dt><dd>Alex Morgan</dd></div><div class="dl-row"><dt>Email address</dt><dd>alex.morgan@example.com</dd></div><div class="dl-row"><dt>Account role</dt><dd><span class="pill admin">Administrator</span></dd></div><div class="dl-row"><dt>Email verified</dt><dd><span class="pill success">Yes</span></dd></div></dl></section><aside class="card notice" data-od-id="profile-boundary"><h3>Account changes aren’t available here</h3><p>Profile editing, password management, and self-service account deletion are intentionally outside this product’s current scope.</p></aside></div>`}
    function adminHeader(title,copy,actions=''){return `<div class="admin-banner" data-od-id="admin-access-banner"><div><strong>Administrator workspace</strong><br><span>Metadata and platform operations only. Personal file content remains private.</span></div><span class="pill admin">Restricted</span></div>${head('Platform administration',title,copy,actions)}`}
    const demoUsers=[['Maya Chen','maya@example.com','USER','Aug 18, 2026'],['Jon Bell','jon@example.com','ADMIN','Aug 09, 2026'],['Sam Rivera','sam@example.com','USER','Jul 27, 2026']];
    function adminOverview(){return `${adminHeader('Platform pulse','A current metadata-only snapshot across Fileora. Read-only views do not create audit events.')}<section class="metric-grid"><article class="card metric"><div class="metric-top"><span>Total users</span>${I('users')}</div><strong>248</strong><small>Current accounts</small></article><article class="card metric"><div class="metric-top"><span>Total files</span>${I('files')}</div><strong>3,842</strong><small>Retained metadata records</small></article><article class="card metric"><div class="metric-top"><span>Stored bytes</span><span class="mono">ALL</span></div><strong>18.6 GB</strong><small>Across current files</small></article></section><section class="card" data-od-id="recent-global-uploads"><div class="panel-head"><h2>Recent uploads</h2><span class="pill">Metadata only</span></div><div class="recent-list">${[['Brand-system.pdf','Maya Chen','Today, 14:08'],['research-notes.txt','Jon Bell','Today, 11:42'],['launch-photo.webp','Sam Rivera','Yesterday, 18:21']].map(r=>`<div class="recent-row"><strong>${r[0]}</strong><span>${r[1]}</span><span class="subtle">${r[2]}</span></div>`).join('')}</div></section>`}
    function tablePage(kind){if(kind==='users')return `${adminHeader('User directory','Search safe account metadata, manage eligible roles, or permanently remove an account and all owned state.')}<section class="card"><div class="filters"><input maxlength="200" aria-label="Search users" placeholder="Search name or email"><select aria-label="Role"><option>All roles</option><option>User</option><option>Administrator</option></select><select aria-label="Sort users"><option>Newest first</option><option>Name</option><option>Email</option><option>Role</option></select></div><div class="table-wrap"><table class="file-table admin-table"><thead><tr><th>User</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead><tbody>${demoUsers.map((u,i)=>`<tr><td><strong>${u[0]}</strong><br><span class="subtle">${u[1]}</span></td><td><span class="pill ${u[2]==='ADMIN'?'admin':''}">${u[2]}</span></td><td>${u[3]}</td><td><div class="table-actions"><button class="btn" onclick="adminRole('${u[0]}','${u[2]}')">Change role</button><button class="btn danger" onclick="adminDelete('user','${u[1]}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></section>${pagination(3)}`;if(kind==='files')return `${adminHeader('Global file metadata','Browse owner-safe metadata and permanently delete files. Preview and download are never available to administrators.')}<section class="card"><div class="filters"><input maxlength="200" aria-label="Search global files" placeholder="Search filename or owner"><select><option>All types</option><option>PDF</option><option>Text</option><option>Image</option><option>Document</option></select><select><option>Any folder</option><option>Root</option><option>In folder</option></select></div><div class="table-wrap"><table class="file-table admin-table"><thead><tr><th>File</th><th>Owner</th><th>Type / size</th><th>Uploaded</th><th>Action</th></tr></thead><tbody>${sampleFiles.slice(0,4).map((f,i)=>`<tr><td><strong>${f.name}</strong></td><td>${demoUsers[i%3][0]}<br><span class="subtle">${demoUsers[i%3][1]}</span></td><td>${f.type} · ${f.size}</td><td>${f.date}</td><td><button class="btn danger" onclick="adminDelete('file','${f.name}')">Delete</button></td></tr>`).join('')}</tbody></table></div></section>${pagination(4)}`;return `${adminHeader('Audit history','Sanitized security-relevant activity, newest first. Audit reads do not generate additional events.')}<section class="card"><div class="filters"><input maxlength="200" aria-label="Search audit history" placeholder="Search action or target"><select><option>All outcomes</option><option>SUCCESS</option><option>FAILURE</option><option>DENIED</option></select><select><option>All actors</option><option>Current user</option><option>Deleted user</option><option>System</option></select></div><div class="table-wrap"><table class="file-table admin-table"><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Entity</th><th>Outcome</th></tr></thead><tbody>${[['Aug 24, 14:12','Alex Morgan','ADMIN_FILE_DELETE','FILE','SUCCESS'],['Aug 24, 13:48','System','SESSION_REFRESH','—','SUCCESS'],['Aug 24, 11:05','Deleted user','FILE_DOWNLOAD','FILE','SUCCESS'],['Aug 23, 20:14','Maya Chen','FOLDER_DELETE','FOLDER','DENIED']].map(r=>`<tr>${r.map((v,i)=>`<td>${i===4?`<span class="pill ${v==='SUCCESS'?'success':''}">${v}</span>`:v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>${pagination(4)}`}
    function render(){let content=state.route==='overview'?overview():state.route==='files'?filesView():state.route==='profile'?profile():state.route==='admin-overview'?adminOverview():state.route==='admin-users'?tablePage('users'):state.route==='admin-files'?tablePage('files'):tablePage('audit');document.getElementById('root').innerHTML=shell(content)}
    function openDetails(id){const f=state.files.find(x=>x.id===id);if(!f)return;openOverlay(`<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="drawer-head"><div><div class="eyebrow">File details</div><h2 id="detailTitle">${f.name}</h2></div><button class="icon-btn" aria-label="Close details" onclick="closeOverlay()">${I('x')}</button></div><div class="drawer-body"><div class="preview"><div class="preview-page" aria-label="Document preview"><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div></div></div><dl class="dl"><div class="dl-row"><dt>Verified type</dt><dd>${f.type}</dd></div><div class="dl-row"><dt>Exact size</dt><dd>${f.size}</dd></div><div class="dl-row"><dt>Location</dt><dd>My Files / ${f.folder}</dd></div><div class="dl-row"><dt>Uploaded</dt><dd>${f.date}, 14:08</dd></div><div class="dl-row"><dt>Text extraction</dt><dd><span class="pill success">Available</span></dd></div></dl><div class="drawer-actions"><button class="btn" onclick="toast('Download started for ${f.name}.')">${I('download')}Download original</button><button class="btn" onclick="moveFile(${f.id})">${I('move')}Move file</button><button class="btn danger" onclick="deleteFile(${f.id})">${I('trash')}Delete permanently</button></div></div></div>`,'drawer')}
    function openOverlay(html,type='modal'){const o=document.createElement('div');o.id='overlay';o.className=`overlay ${type==='modal'?'modal-wrap':''}`;o.innerHTML=html;o.addEventListener('mousedown',e=>{if(e.target===o)closeOverlay()});document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add('open'));document.addEventListener('keydown',escapeOverlay);setTimeout(()=>o.querySelector('button,input,select')?.focus(),80)}
    function escapeOverlay(e){if(e.key==='Escape')closeOverlay()}
    function closeOverlay(){const o=document.getElementById('overlay');if(!o)return;o.classList.remove('open');document.removeEventListener('keydown',escapeOverlay);setTimeout(()=>o.remove(),180)}
    function openModal(kind){if(kind==='upload')return uploadModal();if(kind==='folder')return openOverlay(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="folderTitle"><h2 id="folderTitle">Create a folder</h2><p>Add a child folder inside <strong>${state.folder}</strong>. Folder depth is limited to 10 levels.</p><div class="field"><label for="folderName">Folder name</label><input id="folderName" maxlength="120" placeholder="e.g. Planning"><div class="hint">No slashes, control characters, or duplicate sibling names.</div></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="saveFolder()">Create folder</button></div></div>`);if(kind==='filters')return openOverlay(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="filterTitle"><h2 id="filterTitle">Filter files</h2><p>Changes apply together and return the collection to page 1.</p><div class="field"><label>Type</label><select><option>All types</option><option>PDF</option><option>Text</option><option>Image</option><option>Document</option></select></div><div class="field"><label>Sort by</label><select><option>Uploaded date</option><option>Name</option><option>Size</option></select></div><div class="field"><label>Direction</label><select><option>Descending</option><option>Ascending</option></select></div><div class="field"><label>Page size</label><select><option>20 files</option><option>10 files</option><option>5 files</option></select></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="closeOverlay();toast('Filters applied.')">Apply filters</button></div></div>`)}
    function uploadModal(){openOverlay(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle"><h2 id="uploadTitle">Upload to ${state.folder}</h2><p>Select 1–10 files. Uploads run sequentially and earlier successes remain if a later file fails.</p><div class="dropzone" id="dropzone" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">${I('upload')}<strong style="display:block;margin:10px 0 5px">Drop files here</strong><span class="subtle">PDF, TXT, JPEG, PNG, WebP, DOCX · up to 5 MB each</span><div style="margin-top:14px"><label class="btn"><input type="file" multiple hidden onchange="queueFiles(this.files)">Choose files</label></div></div><div id="queue" class="queue">${queueHTML()}</div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">Close</button><button class="btn primary" id="uploadStart" ${state.queue.length?'':'disabled'} onclick="startUploads()">Upload queued files</button></div></div>`)}
    function handleDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag');queueFiles(e.dataTransfer.files)}
    function queueFiles(list){if(list.length>10){document.getElementById('queue').innerHTML='<div class="alert" role="alert">Choose no more than 10 files in one selection. This batch was not added.</div>'+queueHTML();return}for(const f of list)state.queue.push({name:f.name,status:'Pending',progress:0});document.getElementById('queue').innerHTML=queueHTML();document.getElementById('uploadStart').disabled=!state.queue.length}
    function queueHTML(){return state.queue.map((f,i)=>`<div class="queue-item"><div class="queue-row"><strong>${f.name}</strong><span>${f.status}${f.status==='Uploading'?` · ${f.progress}%`:''}</span></div><div class="track"><span style="width:${f.progress}%"></span></div>${f.status==='Error'?`<button class="btn" style="min-height:34px;margin-top:8px" onclick="retryUpload(${i})">Retry</button>`:''}</div>`).join('')}
    async function startUploads(){const btn=document.getElementById('uploadStart');btn.disabled=true;for(let i=0;i<state.queue.length;i++){const f=state.queue[i];if(!['Pending','Error'].includes(f.status))continue;f.status='Uploading';for(const p of [18,46,73,100]){f.progress=p;document.getElementById('queue').innerHTML=queueHTML();await new Promise(r=>setTimeout(r,180))}f.status='Success';document.getElementById('queue').innerHTML=queueHTML()}toast('Upload queue completed.');btn.disabled=false}
    function retryUpload(i){state.queue[i].status='Pending';state.queue[i].progress=0;document.getElementById('queue').innerHTML=queueHTML()}
    function saveFolder(){const v=document.getElementById('folderName').value.trim();if(!v)return document.getElementById('folderName').focus();closeOverlay();toast(`Folder “${v}” created.`)}
    function folderOptions(){if(state.folder==='My Files')return toast('Root cannot be renamed or deleted.');openOverlay(`<div class="modal"><h2>Folder options</h2><p>Rename <strong>${state.folder}</strong>, or permanently delete it if it is empty. Folders cannot be moved.</p><div class="field"><label>Folder name</label><input value="${state.folder}" maxlength="120"></div><div class="modal-actions"><button class="btn danger" onclick="toast('Folder must be empty before deletion.');closeOverlay()">Delete permanently</button><button class="btn primary" onclick="toast('Folder renamed.');closeOverlay()">Save</button></div></div>`)}
    function moveFile(id){const f=state.files.find(x=>x.id===id);closeOverlay();setTimeout(()=>openOverlay(`<div class="modal"><h2>Move “${f.name}”</h2><p>Choose root or one of your folders. Folder movement is not supported.</p><div class="breadcrumbs"><button>My Files</button></div>${['My Files','Strategy','Research','Brand assets'].map(x=>`<button class="folder" onclick="this.parentElement.querySelectorAll('.folder').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${I('files','sm')}${x}</button>`).join('')}<div class="modal-actions"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="closeOverlay();toast('File moved successfully.')">Move here</button></div></div>`),200)}
    function deleteFile(id){const f=state.files.find(x=>x.id===id);closeOverlay();setTimeout(()=>openOverlay(`<div class="modal" role="alertdialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">Delete “${f.name}”?</h2><p>This permanently removes the file, preview, extracted text, and storage usage. There is no trash, restore, or undo.</p><div class="modal-actions"><button class="btn" autofocus onclick="closeOverlay()">Cancel</button><button class="btn danger" onclick="state.files=state.files.filter(x=>x.id!==${id});closeOverlay();render();toast('File permanently deleted.')">Delete permanently</button></div></div>`),200)}
    function adminRole(name,role){openOverlay(`<div class="modal"><h2>Change ${name}’s role?</h2><p>Current role: <strong>${role}</strong>. Changing it invalidates the user’s active sessions. You cannot demote the final administrator.</p><div class="field"><label>New role</label><select><option>${role==='USER'?'ADMIN':'USER'}</option></select></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="closeOverlay();toast('User role updated.')">Confirm role change</button></div></div>`)}
    function adminDelete(kind,target){const label=kind==='user'?'email address':'exact filename';openOverlay(`<div class="modal"><h2>Permanently delete this ${kind}?</h2><p>${kind==='user'?'This also removes owned files, folders, sessions, and verification codes.':'This removes metadata and stored content without granting you content access.'} This cannot be undone.</p><div class="field"><label>Type the ${label}</label><input id="confirmTarget" placeholder="${target}" oninput="document.getElementById('confirmDelete').disabled=this.value!=='${target.replaceAll("'","&#39;")}'"></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn danger" id="confirmDelete" disabled onclick="closeOverlay();toast('${kind==='user'?'User':'File'} permanently deleted.')">Delete permanently</button></div></div>`)}
    function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span>${msg}</span><button aria-label="Dismiss notification" onclick="this.parentElement.remove()">×</button>`;document.getElementById('toasts').appendChild(t);while(document.getElementById('toasts').children.length>4)document.getElementById('toasts').firstChild.remove();setTimeout(()=>t.remove(),4500)}
    function showLanding(){document.getElementById('root').innerHTML=`<div class="landing"><nav class="landing-nav"><button class="brand"><span class="brand-mark"></span>Fileora</button>${themeButton()}<button class="btn" onclick="showAuth('login')">Sign in</button></nav><main id="content"><section class="landing-hero" data-od-id="landing-hero"><div><div class="eyebrow">Private by design</div><h1>Order for every file.</h1><p>Fileora gives your personal archive a calm, dependable home—with resilient sessions, precise organization, and room to grow.</p><div class="landing-actions"><button class="btn primary" onclick="showAuth('register')">Create your account</button><button class="btn" onclick="showAuth('login')">I already have an account</button></div></div><div class="landing-visual" aria-label="Fileora workspace preview"><div class="mini-ui"><div class="mini-nav">${'<div class="mini-line"></div>'.repeat(7)}</div><div class="mini-main"><div class="mini-title"></div><div class="mini-grid"><div class="mini-card"></div><div class="mini-card"></div><div class="mini-card"></div></div></div></div></div></section><section class="landing-features"><article class="landing-feature"><strong>Owner-scoped privacy</strong><p>Your file content stays within your workspace. Administrative access is limited to safe metadata.</p></article><article class="landing-feature"><strong>Session resilience</strong><p>Secure background renewal helps active work continue without surfacing credential complexity.</p></article><article class="landing-feature"><strong>Built to extend</strong><p>A clear, reusable product system supports the archive as new capabilities responsibly arrive.</p></article></section></main></div>`}
    function showAuth(kind){if(kind==='landing')return showLanding();const verify=kind==='verify';const register=kind==='register';document.getElementById('root').innerHTML=`<div class="auth-shell"><div class="theme-row">${themeButton()}</div><section class="auth-story"><button class="brand" onclick="showLanding()"><span class="brand-mark"></span>Fileora</button><div><h1>Your files.<br>Organized your way.</h1><p>A private, resilient archive with precise controls and no clutter around the work.</p></div><small>© 2026 Fileora · Secure file management</small></section><main id="content" class="auth-form"><div class="eyebrow">${verify?'Email verification':register?'Create account':'Welcome back'}</div><h2>${verify?'Check your inbox':register?'Begin your archive':'Sign in to Fileora'}</h2><p>${verify?'Enter the current eight-digit code. It remains valid for ten minutes.':register?'Create an unverified account, then confirm your email to continue.':'Use your verified account to return to your workspace.'}</p><form onsubmit="event.preventDefault();${verify?"toast('Verified. Taking you to sign in…');setTimeout(()=>showAuth('login'),700)":register?"toast('Account created. Check your email.');showAuth('verify')":"toast('Welcome back, Alex.');state.route='files';render()"}">${register?`<div class="field"><label for="name">Name</label><input id="name" required maxlength="120" autocomplete="name"></div>`:''}<div class="field"><label for="email">Email address</label><input id="email" type="email" required maxlength="320" value="${verify?'alex.morgan@example.com':''}" autocomplete="email"></div>${verify?`<div class="field"><label for="code">Eight-digit code</label><input id="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" oninput="this.value=this.value.replace(/\\D/g,'')"></div>`:`<div class="field"><label for="password">Password</label><input id="password" type="password" required ${register?'minlength="8"':''} maxlength="1024" autocomplete="${register?'new-password':'current-password'}"><div class="hint">${register?'At least 8 characters.':'Use the password for this verified account.'}</div></div>`}<button class="btn primary" type="submit">${verify?'Verify email':register?'Create account':'Sign in'}</button></form><div class="auth-links">${verify?`<button onclick="toast('If an account exists, a replacement code was sent.')">Send a new code</button><button onclick="showAuth('login')">Back to sign in</button>`:register?`<span>Already verified?</span><button onclick="showAuth('login')">Sign in</button>`:`<span>New to Fileora?</span><button onclick="showAuth('register')">Create account</button>`}</div></main></div>`}
    render();
  </script>
</body>
