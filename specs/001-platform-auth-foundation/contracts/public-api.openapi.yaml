openapi: 3.1.0
info:
  title: Gold Era Phase 1 Public API
  version: 1.0.0
  description: Browser-visible Express and same-origin Next.js authentication contracts. Raw refresh tokens never appear here.
servers:
  - url: https://api.example.invalid
    description: Express authority; replace from NEXT_PUBLIC_API_BASE_URL
tags:
  - name: Registration
  - name: GatewayAuth
  - name: Profile
  - name: Authorization
paths:
  /api/v1/auth/register:
    post:
      tags: [Registration]
      operationId: register
      summary: Create one unverified regular account and initiate email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account persisted and verification message accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/RegistrationUnavailable'
        '503':
          description: Account is persisted but email delivery is pending, or required persistence is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/verify-email:
    post:
      tags: [Registration]
      operationId: verifyEmail
      summary: Consume the current eligible email-verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Code is incorrect, expired, used, or superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/resend-verification:
    post:
      tags: [Registration]
      operationId: resendVerification
      summary: Replace earlier unused verification codes within abuse limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Generic accepted response; does not disclose account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Verification issuance is temporarily limited
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Delivery is pending or persistence is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/auth/login:
    servers:
      - url: https://app.example.invalid
        description: Same-origin Next.js gateway
    post:
      tags: [GatewayAuth]
      operationId: gatewayLogin
      summary: Validate credentials through Express, store the refresh cookie, and return safe authenticated state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Refresh cookie emitted and authenticated state returned
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Host-only HttpOnly refresh cookie; raw value is never represented in JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Generic invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Account requires email verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/refresh:
    servers:
      - url: https://app.example.invalid
        description: Same-origin Next.js gateway
    post:
      tags: [GatewayAuth]
      operationId: refreshGatewaySession
      summary: Rotate the refresh credential, replace the cookie, and return safe authenticated state
      responses:
        '200':
          description: Replacement cookie emitted and authenticated state returned
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Refresh credential rejected and cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/logout:
    servers:
      - url: https://app.example.invalid
        description: Same-origin Next.js gateway
    post:
      tags: [GatewayAuth]
      operationId: gatewayLogout
      summary: Revoke the presented refresh record when possible and always clear local cookie state
      responses:
        '200':
          description: Logout is safe and idempotent
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '503':
          description: Authority unavailable; cookie is still cleared and client state must be cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/users/me:
    get:
      tags: [Profile]
      operationId: getOwnProfile
      summary: Return only the authenticated user's safe profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Safe own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/access-check:
    get:
      tags: [Authorization]
      operationId: checkAdminAccess
      summary: Minimal Phase 1 operation proving server-enforced administrator authorization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller is an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 1024
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^[0-9]{8}$'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    SafeUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, isEmailVerified, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccessSession:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT; client memory only
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/SafeUser'
    RegistrationResult:
      type: object
      additionalProperties: false
      required: [email, verificationRequired]
      properties:
        email:
          type: string
          format: email
        verificationRequired:
          type: boolean
          const: true
    MessageResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    LogoutResult:
      type: object
      additionalProperties: false
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true
    AdminAccessResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
          const: true
    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - AUTH_REGISTRATION_UNAVAILABLE
            - AUTH_VERIFICATION_DELIVERY_PENDING
            - AUTH_VERIFICATION_INVALID
            - AUTH_VERIFICATION_REQUIRED
            - AUTH_INVALID_CREDENTIALS
            - AUTH_ACCESS_INVALID
            - AUTH_ACCESS_EXPIRED
            - AUTH_REFRESH_INVALID
            - AUTHENTICATION_FAILED
            - AUTH_REQUIRED
            - AUTH_FORBIDDEN
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
        message:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        requestId:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorBody'
    RegistrationResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/RegistrationResult'
    UserResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SafeUser'
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AccessSession'
    MessageResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MessageResult'
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LogoutResult'
    AdminAccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AdminAccessResult'
  responses:
    ValidationError:
      description: Safe field validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RegistrationUnavailable:
      description: Registration cannot be completed; response does not disclose account details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Access credential missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller lacks the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Retryable dependency or persistence failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
