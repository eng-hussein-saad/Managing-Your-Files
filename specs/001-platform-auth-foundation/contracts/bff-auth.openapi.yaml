openapi: 3.1.0
info:
  title: Gold Era Phase 1 Trusted BFF-to-Express Authentication API
  version: 1.0.0
  description: Server-to-server contract. Raw refresh material must never be returned to an untrusted browser or included in browser bundles.
servers:
  - url: https://api.example.invalid
security:
  - bffTrust: []
paths:
  /internal/v1/auth/login:
    post:
      operationId: trustedLogin
      summary: Validate verified-user credentials and issue an access/refresh pair to the trusted gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials issued to the trusted gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedAuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/auth/refresh:
    post:
      operationId: trustedRefresh
      summary: Atomically revoke the presented refresh token and issue its replacement pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawRefreshRequest'
      responses:
        '200':
          description: Refresh token rotated and replacement credentials issued to the trusted gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedAuthResponse'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/auth/logout:
    post:
      operationId: trustedLogout
      summary: Idempotently revoke the presented refresh token when valid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionalRawRefreshRequest'
      responses:
        '200':
          description: Safe idempotent logout result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bffTrust:
      type: apiKey
      in: header
      name: X-Gold-Era-BFF-Trust
      description: Server-only high-entropy secret; constant-time checked and always redacted
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    RawRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 40
          writeOnly: true
    OptionalRawRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 40
          writeOnly: true
    SafeUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, isEmailVerified, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrustedAuthResult:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT returned by the gateway to browser memory only
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
        refreshToken:
          type: string
          minLength: 40
          x-sensitive: true
          description: Raw opaque credential consumed by the gateway and stored only in its HttpOnly response cookie
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/SafeUser'
    LogoutResult:
      type: object
      additionalProperties: false
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - AUTH_INVALID_CREDENTIALS
            - AUTH_VERIFICATION_REQUIRED
            - AUTH_REFRESH_INVALID
            - TRUST_REQUIRED
            - SERVICE_UNAVAILABLE
        message:
          type: string
        requestId:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorBody'
    TrustedAuthResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TrustedAuthResult'
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LogoutResult'
  responses:
    Error:
      description: Safe error envelope with no raw credential or trust details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
